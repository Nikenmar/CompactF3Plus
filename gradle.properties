org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 26.1+ uses official Mojang names natively (Mojang dropped obfuscation), so no
# Yarn mappings are published for this MC line. Loom must use officialMojangMappings().
minecraft_version=26.1.2
# Default build target. Same source compiles + runs cleanly against 26.1 / 26.1.1 /
# 26.1.2 (each verified with its own NF/Fabric API stream). To produce a per-patch
# build, override `minecraft_version` and `fabric_api_version` on the CLI.
minecraft_version_range=>=26.1 <=26.1.2

# Fabric Loader: 0.19.x supports Java 25.
loader_version=0.19.2
loader_version_range=>=0.19.0

# Fabric API for 26.1.2 (latest patch stream).
fabric_api_version=0.147.0+26.1.2

# 18.0.0-alpha.x is the only published line for 26.1 / Java 25 at the moment.
modmenu_version=18.0.0-alpha.8
# cloth-config intentionally omitted: this branch stores config as plain JSON
# (compactf3plus.json) via GSON, the same pattern as 1.21-fabric used. One fewer
# dependency, one fewer thing to track across alpha churn.

mod_id=compactf3plus
mod_name=Compact F3 Plus
mod_license=MIT
mod_version=1.1.2
mod_group_id=net.nikenmar.compactf3plus
mod_authors=nikenmar
mod_description=A sleek, customizable HUD overlay replacing the cluttered vanilla F3 screen. Shows essential info such as FPS, server TPS, exact coordinates, speed, biome, and direction in a compact format. Includes an in-game config menu. A fork of Compact F3 by username65735.
