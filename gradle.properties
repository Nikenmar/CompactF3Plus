org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 26.1+ uses official Mojang names natively (Mojang dropped obfuscation), so no
# Yarn mappings are published for this MC line. Loom must use officialMojangMappings().
minecraft_version=26.2
# Default build target. 26.2 currently ships a single patch; the range stays open
# across the 26.2 line because Mojang dropped obfuscation and per-patch API drift
# is nil (see DECISIONS: one branch per MC-major, not per-patch).
minecraft_version_range=>=26.2 <26.3
# Suffix used in the published jar file names.
mc_line=26.2.x

# Fabric Loader: 0.19.x supports Java 25.
loader_version=0.19.3
loader_version_range=>=0.19.0

# Fabric API for 26.2.
fabric_api_version=0.157.0+26.2

# ModMenu 20.x is the 26.2 line — a proper release, unlike the 18.0.0-alpha.x
# the 26.1 branch had to pin.
modmenu_version=20.0.1

# NeoForge API for 26.2.x — first STABLE NeoForge for the 26.x era (26.1 was
# beta-only), so no -beta suffix in the range either.
neo_version=26.2.0.59
neo_version_range=[26.2.0.0,)
neo_loader_version_range=[5,)
# cloth-config intentionally omitted: this branch stores config as plain JSON
# (compactf3plus.json) via GSON, the same pattern as 1.21-fabric used. One fewer
# dependency, one fewer thing to track across alpha churn.

mod_id=compactf3plus
mod_name=Compact F3 Plus
mod_license=MIT
mod_version=1.1.6
mod_group_id=net.nikenmar.compactf3plus
mod_authors=nikenmar
mod_description=A sleek, customizable HUD overlay replacing the cluttered vanilla F3 screen. Shows essential info such as FPS, server TPS, exact coordinates, speed, biome, and direction in a compact format. Includes an in-game config menu. A fork of Compact F3 by username65735.
